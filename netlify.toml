# Inventory storefront preview configuration. Existing app remains at repository root.
[build]
base = "new-store"
command = "npm run build"
publish = ".next"
[build.environment]
NODE_VERSION = "22"
[functions]
directory = "netlify/functions"
[functions."generate-illustration-background"]
node_bundler = "esbuild"
external_node_modules = ["sharp"]
[functions."generate-print-background"]
node_bundler = "esbuild"
external_node_modules = ["sharp"]
[[plugins]]
package = "@netlify/plugin-nextjs"
