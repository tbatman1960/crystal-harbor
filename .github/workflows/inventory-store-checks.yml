name: Inventory storefront checks
on:
  pull_request:
    paths:
      - 'new-store/**'
      - 'netlify.toml'
      - '.github/workflows/inventory-store-checks.yml'
  push:
    branches: ['inventory-store-flat-shipping']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-store/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
